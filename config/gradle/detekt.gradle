apply plugin: "dev.detekt"

dependencies {
    // enables the ktlint-backed formatting rules that .editorconfig configures
    detektPlugins(rootProject.libs.detekt.ktlint.wrapper)
}

tasks.withType(Detekt).configureEach {
    exclude("**/gen/**")
    reports {
        html.required.set(true) // observe findings in your browser with structure and code snippets
        checkstyle.required.set(true) // checkstyle like format mainly for integrations like Jenkins
        sarif.required.set(true)
        // standardized SARIF format (https://sarifweb.azurewebsites.net/) to support integrations with Github Code Scanning
    }
}

detekt {
    config.setFrom("${rootDir}/config/detekt.yml")
    buildUponDefaultConfig = true
}

tasks.assemble.finalizedBy(tasks.detekt)
