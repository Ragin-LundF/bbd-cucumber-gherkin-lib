// Without this the standard streams are swallowed and a failure is reported as the exception type
// plus a line number, which says nothing about what actually went wrong.
def readableTestOutput = {
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        showStackTraces = true
        events 'failed'
    }
}

// exclude the cucumber suites from the default test task
test {
    exclude '**/*CucumberRunner*'
    exclude '**/*CucumberSecurity*'
    useJUnitPlatform()
    configure readableTestOutput
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

tasks.register('cucumber', Test) {
    useJUnitPlatform()
    group = 'verification'
    exclude '**/*Test*'
    include '**/*CucumberRunner*'
    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath

    configure readableTestOutput

    minHeapSize = "512m"
    maxHeapSize = "1024m"

    onlyIf("Execute only if cucumber task is called directly") {
        gradle.startParameter.taskNames.contains("cucumber")
    }
}

// The security scan starts a scanner container, routes the whole run through its proxy and then
// attacks the application, so it never belongs to 'test' or 'cucumber'. It needs Docker and it is
// slow, which is why it only runs when it is asked for by name.
tasks.register('cucumberSecurity', Test) {
    useJUnitPlatform()
    group = 'verification'
    exclude '**/*Test*'
    include '**/*CucumberSecurity*'
    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath

    configure readableTestOutput

    minHeapSize = "512m"
    maxHeapSize = "1024m"

    // A consuming project puts this into a spring profile. Here it has to be system properties,
    // because the context configuration class pins its profile with @ActiveProfiles, which wins
    // over spring.profiles.active.
    systemProperty 'cucumbertest.security.enabled', 'true'

    // The application under test runs in this JVM on the host while the scanner runs in a
    // container, so every URL the tests build has to use the Testcontainers host alias. No port is
    // configured: the main web server is discovered under the random port it actually bound, and
    // the security hook exposes exactly that port to the container.
    systemProperty 'cucumbertest.server.protocol', 'http'
    systemProperty 'cucumbertest.server.host', 'host.testcontainers.internal'
    systemProperty 'cucumbertest.services.server.path-prefixes[0]', '/api'

    // REQUIRED. ZAP serves the proxy and its own REST API on one port and tells them apart by the
    // Host header, and both JDK HTTP clients treat Host as restricted and would silently drop it.
    systemProperty 'sun.net.http.allowRestrictedHeaders', 'true'
    systemProperty 'jdk.httpclient.allowRestrictedHeaders', 'host'

    systemProperty 'cucumbertest.security.report.output-dir',
        layout.buildDirectory.dir('reports/security').get().asFile.absolutePath

    onlyIf("Execute only if cucumberSecurity task is called directly") {
        gradle.startParameter.taskNames.contains("cucumberSecurity")
    }
}
