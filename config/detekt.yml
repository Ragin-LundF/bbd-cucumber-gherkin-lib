# Overwrites for Detekt
# Example for most configs: https://github.com/detekt/detekt/blob/main/config/detekt/detekt.yml
# Docs: https://detekt.dev/docs/intro
style:
  # using 5 instead of 2
  ReturnCount:
    active: true
    excludeGuardClauses: true
    max: 5
  MagicNumber:
    ignoreAnnotation: true

complexity:
  TooManyFunctions:
    excludes: ['**/extension/**', '**/test/**', '**/functionalTest/**']
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 30
    allowedFunctionsPerInterface: 30

performance:
  # disabled since Kotlin compiler optimizations since 1.1.60
  SpreadOperator:
    active: false

ktlint:
  # Contradicts .ai/instructions/coding-guidelines.md:15 -- "Implement functions with
  # block bodies. Do not use expression-body functions."
  FunctionExpressionBody:
    active: false
  # This codebase deliberately does not use trailing commas; the ktlint defaults would
  # rewrite ~73 call/declaration sites purely to adopt a style never chosen here.
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
