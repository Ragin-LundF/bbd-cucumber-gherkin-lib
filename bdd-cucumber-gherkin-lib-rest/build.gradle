ext {
    publishArtifactId = "bdd-cucumber-gherkin-lib-rest"
    publishDescription = "REST API based sentences for bdd-cucumber-gherkin-lib"
}

dependencies {
    api project(':bdd-cucumber-gherkin-lib-core')

    // --- Spring
    implementation(libs.spring.boot.test)
    implementation(libs.bundles.spring.boot.restTestTemplate)

    // --- JSON
    implementation(libs.json.path)

    // --- Testing
    implementation(libs.testing.kotlin.test)

    // SLF4J binding for the unit tests, otherwise SLF4J falls back to NOP and warns
    testImplementation(libs.logging.slf4j)

    // --- HTTP Client
    implementation(libs.httpclient)

    // --- Commons
    implementation(libs.commons.text)

    // --- Logging
    implementation(libs.logging.logger)
}
