# The build excludes logback, so slf4j-simple is the binding and Spring Boot's logging.level.*
# settings do not apply. These properties are the ones that actually take effect.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.com.ragin.bdd.cucumber=info
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.logFile=System.out
