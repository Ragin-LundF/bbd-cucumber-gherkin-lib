cucumberTest:
  authorization:
    bearer-token:
      # To change values goto
      # * Open https://jwt.io/
      # * Use HS256
      # * Use secret in the verify signature box
      # * Update no scopes as well!
      #
      # {
      #   "user_id": 2,
      #   "user_name": "demo",
      #   "scope": [
      #     "test.readonly",
      #     "test.initiate",
      #   ],
      #   "iss": "LUNDF",
      #   "iat": 1551549022,
      #   "exp": 3548427760,
      #   "jti": "oiaEaa8IhGQBgu3eXwSErw"
      # }
      default: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..mFmI0-1jcQib1P9XJK6W1yIu7bQex9LuwHhecA4TF2k"
      noscope: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..E6VBxTBtgpME21GaspJNVNZHABU2ibUqYY4MS9cdDLM"
  scenario-context:
    CTX_PRE_DEFINED_USER: Pre Defined
    CTX_PRE_DEFINED_FIRST_ID: abcdefg
  proxy:
    host: localhost
    port: -1
  ssl:
    disableCheck: false
  # Both are off by default. They are switched on here so the library's own report demonstrates
  # them, and so the header obfuscation is exercised end to end by every authorized scenario.
  logging:
    headers: true
    sql: true

# Starts the actuator on its own random port, so the library's own tests run against an
# application with two ports. server.port is 0 (RANDOM_PORT) and management.server.port is 0,
# which Spring Boot treats as DIFFERENT and therefore creates a separate management context.
management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health

spring:
  main:
    banner-mode: off

  datasource:
    url: jdbc:tc:postgresql:17:///cucumber
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: cucumber
    password: cucumber

  jpa:
    # Hibernate writes this straight to System.out, which drowns the scenario output. The library
    # reports the SQL it runs itself through cucumberTest.logging.sql.
    show-sql: false
    hibernate:
      globally_quoted_identifiers: true
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

# Two logging systems are in play here:
# * java.util.logging, used directly by Tomcat and Liquibase. Spring Boot configures it through
#   logging.level below, because with logback excluded its JavaLoggingSystem is the one in use.
# * SLF4J with slf4j-simple as the binding, used by Spring itself and by this library. Spring Boot
#   cannot configure that one, so its levels live in simplelogger.properties.
logging.level:
  root: warn
  org:
    apache: warn
    springframework: warn
  liquibase: warn
