[versions]
kotlin = "2.3.21"
springBoot = "4.1.0"
cucumber = "7.34.6"
testcontainers = "2.0.5"

#
[libraries]
# --- Classpath Kotlin Gradle Plugin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
#
# --- Common Libs and Utils
logging-logger = "io.github.oshai:kotlin-logging-jvm:8.0.4"
logging-slf4j = "org.slf4j:slf4j-simple:2.0.18"
#
commons-io = "commons-io:commons-io:2.22.0"
commons-text = "org.apache.commons:commons-text:1.15.0"
commons-lang = "org.apache.commons:commons-lang3:3.20.0"
#
jakarta-validation = "jakarta.validation:jakarta.validation-api:3.1.1"
#
# --- Spring Dependencies
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-web = { module = "org.springframework:spring-web" }
spring-boot = { module = "org.springframework.boot:spring-boot", version.ref = "springBoot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "springBoot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
#
spring-boot-rest-client = { module = "org.springframework.boot:spring-boot-restclient", version.ref = "springBoot" }
spring-boot-rest-client-test = { module = "org.springframework.boot:spring-boot-restclient-test", version.ref = "springBoot" }
spring-boot-rest-test-client = { module = "org.springframework.boot:spring-boot-resttestclient", version.ref = "springBoot" }
#
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase", version.ref = "springBoot" }
#
# --- JSON
json-path = "com.jayway.jsonpath:json-path:3.0.0"
json-unit = "net.javacrumbs.json-unit:json-unit:6.2.0"
#
# --- Cucumber
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-spring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
cucumber-junit-platform = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
#
# --- jUnit / Testing
testing-junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
testing-kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
testing-konsist = "com.lemonappdev:konsist:0.17.3"
#
# --- Jackson
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-jaxb = { module = "tools.jackson.module:jackson-module-jaxb-annotations" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-module-blackbird = { module = "tools.jackson.module:jackson-module-blackbird" }
jackson-dataformmat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson-dataformat-csv = { module = "tools.jackson.dataformat:jackson-dataformat-csv" }
#
# --- HTTP Client
httpclient = "org.apache.httpcomponents.client5:httpclient5:5.6.4"
#
# --- Database
database-liquibase = "org.liquibase:liquibase-core:5.0.3"
database-postgres = "org.postgresql:postgresql:42.7.13"
#
# --- Testcontainers
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-jdbc = { module = "org.testcontainers:testcontainers-jdbc", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

#
[bundles]
jackson = [
    "jackson-annotations",
    "jackson-dataformmat-yaml",
    "jackson-jaxb",
    "jackson-module-blackbird",
    "jackson-module-kotlin",
]
cucumber = [
    "cucumber-java",
    "cucumber-junit-platform",
    "cucumber-spring",
]
spring-boot-restTestTemplate = [
    "spring-boot-rest-client",
    "spring-boot-rest-client-test",
    "spring-boot-rest-test-client",
]
testcontainers = [
    "testcontainers",
    "testcontainers-jdbc",
    "testcontainers-junit",
    "testcontainers-postgres",
]

#
[plugins]
jreleaser = "org.jreleaser:1.25.0"
sonarqube = "org.sonarqube:7.4.0.8496"
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kover = "org.jetbrains.kotlinx.kover:0.9.9"
detekt = "dev.detekt:2.0.0-alpha.6"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
