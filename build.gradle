import dev.detekt.gradle.Detekt
import dev.detekt.gradle.DetektCreateBaselineTask
import dev.detekt.gradle.plugin.DetektPluginKt

buildscript {
    dependencies {
        classpath(libs.kotlin.gradle.plugin)
    }
}

plugins {
    id "signing"
    id "java-library"
    id "maven-publish"
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.jreleaser)
    alias(libs.plugins.spring.boot) apply(false)
    alias(libs.plugins.kotlin.jvm) apply(false)
    alias(libs.plugins.kotlin.spring) apply(false)
    alias(libs.plugins.kover)
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.detekt) apply(false)
}

apply from: "${rootDir}/config/gradle/wrapper.gradle"
apply from: "${rootDir}/config/gradle/dependency_updates.gradle"
apply from: "${rootDir}/config/gradle/kover_sonar.gradle"

// JReleaser runs only in the root project: all modules are staged into the root
// build/staging-deploy and uploaded to Maven Central as one deployment (one release).
jreleaser {
    project {
        description = "Cucumber BDD library for simpler e2e tests"
        copyright = "Ragin-LundF"
        license = "MIT"
        links {
            homepage = "https://github.com/Ragin-LundF/bbd-cucumber-gherkin-lib"
        }
        authors = ["Ragin-LundF"]
    }
    signing {
        active = 'ALWAYS'
        verify = false
        armored = true
        mode = 'FILE'
        publicKey = "${rootDir}/ragin_public.pgp"
        secretKey = "${rootDir}/ragin_secret.pgp"
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository(layout.buildDirectory.dir('staging-deploy').get().asFile.path)
                }
            }
        }
    }
}

subprojects {
    // export of classes for subscripts
    ext.Detekt = Detekt
    ext.DetektCreateBaselineTask = DetektCreateBaselineTask

    apply plugin: "idea"
    apply plugin: "maven-publish"
    apply from: "${rootDir}/config/gradle/publishing.gradle"

    if (it.name != 'bdd-cucumber-gherkin-lib-bom') {
        apply plugin: "kotlin"
        apply plugin: "java-library"
        apply plugin: "kotlin-spring"
        apply plugin: "org.springframework.boot"
        apply plugin: "io.spring.dependency-management"
        // overrides the JUnit BOM version managed by Spring Boot - see libs.versions.toml
        ext["junit-jupiter.version"] = libs.versions.junit.get()
        apply plugin: "dev.detekt"
        apply plugin: "org.jetbrains.kotlinx.kover"

        apply from: "${rootDir}/config/gradle/detekt.gradle"
        apply from: "${rootDir}/config/gradle/java.gradle"
        apply from: "${rootDir}/config/gradle/gradle-excludes.gradle"
        apply from: "${rootDir}/config/gradle/tests.gradle"

        rootProject.dependencies.add("kover", it)
    } else {
        apply plugin: "java-platform"
    }

    // convenience task to find transient dependencies. Example usage:
    // "./gradlew allDepInsight --configuration runtimeClasspath --dependency io.netty:netty-buffer"
    tasks.register('allDepInsight', DependencyInsightReportTask) {
        showingAllVariants.set(false)
    }
    // Higher Kotlin Version for Detekt
    configurations.matching { it.name == "detekt" }.configureEach {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion(DetektPluginKt.getSupportedKotlinVersion())
            }
        }
    }
}
